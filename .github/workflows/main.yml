name: Déploiement Docker sur 2 VPS Ubuntu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Déploiement distant via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            # 1. Aller dans le dossier du projet sur le VPS
            cd /chemin/vers/votre/projet

            echo "--- Récupération des dernières modifications ---"
            git fetch origin main
            git reset --hard origin/main

            echo "--- Reconstruction et redémarrage des conteneurs ---"
            # Si vous utilisez la syntaxe moderne (v2) : docker compose
            docker compose down
            docker compose up -d --build

            echo "--- Nettoyage des anciennes images Docker inutilisées ---"
            docker image prune -f

            echo "--- Déploiement Docker terminé avec succès ---"
